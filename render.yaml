# Render blueprint. Three resources: the API, its database, and the static
# frontend that talks to it.
#
# The frontend reaches the API by absolute URL, set once in the dashboard as
# VITE_API_BASE. Development still proxies relative paths through Vite, so the
# two environments differ in exactly one place: the base URL. See the note on
# the static site below for why this is not done with rewrite routes.

databases:
  - name: webutation-db
    databaseName: webutation
    user: webutation
    # Render's instance-type names are CPU-and-memory, not tiers. The old
    # "basic-256mb" is now "0.1c-256mb"; the old tier names are rejected.
    plan: 0.1c-256mb
    postgresMajorVersion: "16"

services:
  # --- API ---------------------------------------------------------------
  - type: web
    name: webutation-api
    runtime: docker
    # Formerly "starter": 0.5 CPU, 512MB. Same machine, current name.
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Creates any missing tables before the new instance takes traffic.
    # create_all only adds what is absent: it will not alter an existing table
    # or enum, so a model change still needs "python -m app.db --drop" run by
    # hand against the deployed database.
    #
    # Worth knowing: the HTTP request path never opens a database session. Runs
    # are held in memory by app/report.py and are lost on restart. The schema
    # and the database are here for the persistence layer that scripts/ and the
    # test suite exercise, not because the deployed API writes to it.
    preDeployCommand: python -m app.db
    # The face model is in the image, so a deploy does not download 300MB
    # before it can serve; but loading it still takes a moment on first use.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webutation-db
          property: connectionString

      # Where the model was baked. Must match the Dockerfile.
      - key: INSIGHTFACE_HOME
        value: /opt/insightface

      # The origin SerpAPI must be able to fetch subject photos from. Set this
      # to this service's own URL once Render has assigned it — reverse image
      # search cannot work until it is right, and /health says so plainly.
      #
      # Not derivable from fromService: its "host" property returns the private
      # network hostname, which SerpAPI cannot reach.
      - key: PUBLIC_BASE_URL
        sync: false

      # Where the browser calls from, so the API can return CORS headers for it.
      # Comma-separated; leave unset locally, where Vite keeps things same-origin.
      - key: ALLOWED_ORIGINS
        sync: false

      # Secret. Set in the dashboard, never in this file.
      - key: SERPAPI_KEY
        sync: false

      # Shared secret the frontend sends as X-Run-Token. Generated once by
      # Render; copy it into the static site's VITE_RUN_TOKEN.
      - key: RUN_ACCESS_TOKEN
        generateValue: true

      # The budget. A run costs live search calls, so this is the control that
      # matters; the token only decides who may ask. See app/ratelimit.py.
      - key: MAX_RUNS_PER_DAY
        value: "100"
      - key: MAX_RUNS_PER_IP_HOURLY
        value: "10"

      # Subject photos are deleted after this long. Publishing a photograph of
      # a person is not a neutral act; the window is short by construction.
      - key: UPLOAD_RETENTION_SECONDS
        value: "86400"

  # --- frontend ----------------------------------------------------------
  - type: web
    name: webutation-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # The API's public URL, set in the dashboard once Render has assigned it.
      #
      # This replaced a set of rewrite routes that proxied /runs, /subjects and
      # /uploads to a hard-coded https://webutation-api.onrender.com. Two things
      # were wrong with that. The hostname is a guess — Render appends a suffix
      # when a service name is already taken, and the guess then 404s everything
      # silently. And Render's own docs say a rewrite whose destination is an
      # absolute URL on another host behaves as a redirect rather than a proxy,
      # so the browser would have ended up cross-origin regardless, without the
      # CORS headers that assumption was avoiding.
      - key: VITE_API_BASE
        sync: false

      # Baked into the bundle at build time, so it is public. That is why the
      # daily cap exists: the token stops a crawler, the cap stops a bill.
      - key: VITE_RUN_TOKEN
        sync: false

    routes:
      # Single-page app: every path that is not a built asset serves the shell.
      - type: rewrite
        source: /*
        destination: /index.html
